router:
  template: debian-12-x64-server-template

defaults:
  ad_domain_functional_level: WinThreshold
  ad_forest_functional_level: WinThreshold
  ad_domain_admin: domainadmin
  ad_domain_admin_password: "DM-Adm1n2026!"
  ad_domain_user: domainuser
  ad_domain_user_password: "DM-User2026!"
  ad_domain_safe_mode_password: SafeMode2026!

ludus:
  # ── Parent Domain: dundermifflin.local ──
  - vm_name: "{{ range_id }}-DM-DC01"
    hostname: "DM-DC01"
    template: win2019-server-x64-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: dundermifflin.local
      role: primary-dc
    roles:
      - dundermifflin_parent_dc

  - vm_name: "{{ range_id }}-DM-SQL01"
    hostname: "DM-SQL01"
    template: win2019-server-x64-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 4
    cpus: 4
    windows:
      sysprep: true
    domain:
      fqdn: dundermifflin.local
      role: member
    roles:
      - name: dundermifflin_member
        depends_on:
          - vm_name: "{{ range_id }}-DM-DC01"
            role: dundermifflin_parent_dc
      - name: badsectorlabs.ludus_mssql
        depends_on:
          - vm_name: "{{ range_id }}-DM-SQL01"
            role: dundermifflin_member
    role_vars:
      # MSSQL attack path configuration
      ludus_mssql_version: "2019"
      ludus_mssql_enable_tcp: true
      ludus_mssql_mixed_mode_auth: true
      ludus_mssql_enable_xp_cmdshell: true
      ludus_mssql_enable_sa: true
      ludus_mssql_sa_password: "sa_P@ssw0rd!"
      ludus_mssql_install_ssms: false
      # svc-sql AD login as sysadmin (kerberoast → SQL admin → xp_cmdshell)
      ludus_mssql_ad_logins:
        - username: "dundermifflin\\svc-sql"
          sysadmin: true
        - username: "dundermifflin\\rhoward"
          sysadmin: false
      # SQL login for brute-force / app compromise path
      ludus_mssql_sql_users:
        - username: "appuser"
          password: "App2026!"
          sysadmin: false
      # Impersonation: rhoward → sa (AS-REP roast → SQL login → impersonate sa → xp_cmdshell)
      ludus_mssql_impersonations:
        - grantor: "sa"
          grantee: "dundermifflin\\rhoward"
      # DB impersonation: appuser → dbo in msdb (Agent job access)
      ludus_mssql_impersonation_users:
        - login: "appuser"
          database: "msdb"
          impersonate_user: "dbo"

  # ── Child Domain: scranton.dundermifflin.local ──
  - vm_name: "{{ range_id }}-SC-DC01"
    hostname: "SC-DC01"
    template: win2019-server-x64-template
    vlan: 10
    ip_last_octet: 20
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    roles:
      - name: dundermifflin_child_dc
        depends_on:
          - vm_name: "{{ range_id }}-DM-DC01"
            role: dundermifflin_parent_dc
      - name: badsectorlabs.ludus_adcs
        depends_on:
          - vm_name: "{{ range_id }}-SC-DC01"
            role: dundermifflin_child_dc
    role_vars:
      # ADCS core config (child DC has no native domain block)
      ludus_adcs_domain: "scranton"
      ludus_adcs_dc: "{{ range_id }}-SC-DC01"
      ludus_adcs_dc_ip: "10.{{ range_second_octet }}.10.20"
      ludus_adcs_ca_host: "SC-DC01"
      ludus_adcs_domain_username: "dundermifflin\\domainadmin"
      ludus_adcs_domain_password: "DM-Adm1n2026!"
      ludus_adcs_domain_fqdn: "scranton.dundermifflin.local"
      ludus_adcs_ca_common_name: "scranton-CA"
      ludus_domain_netbios_name: "scranton"
      ludus_domain_fqdn_tail: "dundermifflin.local"
      # Office-themed ESC users (new accounts created by ludus_adcs)
      ludus_adcs_esc5_user: abernard
      ludus_adcs_esc5_password: "NardDog2026!"
      ludus_adcs_esc7_ca_manager_user: rcalifornia
      ludus_adcs_esc7_ca_manager_password: "Lizard1King!"
      ludus_adcs_esc7_cert_manager_user: amartin_cert
      ludus_adcs_esc7_cert_manager_password: "Cats4Ever!"
      ludus_adcs_esc9_user: kellykapoor
      ludus_adcs_esc9_password: "Fashion2026!"
      ludus_adcs_esc10_user: meredithr
      ludus_adcs_esc10_password: "HappyHour1!"
      ludus_adcs_esc13_user: darryljr
      ludus_adcs_esc13_password: "Warehouse1!"
      ludus_adcs_esc14_user: phyllisvance
      ludus_adcs_esc14_password: "BobVance2026!"
      ludus_adcs_esc14_target_user: todpacker
      ludus_adcs_esc14_target_password: "Packman2026!"
      ludus_adcs_esc16_user: glewis
      ludus_adcs_esc16_password: "Pretzel1Day!"
      # Realistic template names
      ludus_adcs_template_display_names:
        ESC1: "WorkstationAuth"
        ESC2: "SubordinateCA"
        ESC3: "EnrollmentAgent"
        ESC3_CRA: "CertRequestAgent"
        ESC4: "UserAuthCert"
        ESC7_CERTMGR: "CertManagerTemplate"
        ESC9: "WebServerAuth"
        ESC13: "SmartcardLogon"

  # ── Workstations ──
  - vm_name: "{{ range_id }}-SC-WS01"
    hostname: "SC-WS01"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 31
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    roles:
      - name: dundermifflin_workstation
        depends_on:
          - vm_name: "{{ range_id }}-SC-DC01"
            role: dundermifflin_child_dc

  # - vm_name: "{{ range_id }}-SC-WS02"
  #   hostname: "SC-WS02"
  #   template: win11-22h2-x64-enterprise-template
  #   vlan: 10
  #   ip_last_octet: 32
  #   ram_gb: 4
  #   cpus: 2
  #   windows:
  #     sysprep: true
  #   roles:
  #     - name: dundermifflin_workstation
  #       depends_on:
  #         - vm_name: "{{ range_id }}-SC-DC01"
  #           role: dundermifflin_child_dc

  # ── Attacker ──
  - vm_name: "{{ range_id }}-SC-KALI"
    hostname: "SC-KALI"
    template: kali-x64-desktop-template
    vlan: 10
    ip_last_octet: 99
    ram_gb: 4
    cpus: 2
    force_ip: true
    linux:
      packages:
        - nmap
        - netexec
        - impacket-scripts
        - bloodhound
        - certipy-ad
        - responder
        - evil-winrm
        - smbclient
        - ldap-utils
        - john
        - hashcat
        - chisel
    testing:
      snapshot: false
      block_internet: false
