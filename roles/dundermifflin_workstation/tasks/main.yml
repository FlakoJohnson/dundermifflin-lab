---
# dundermifflin_workstation — joins scranton.dundermifflin.local and adds local admin

- name: Set DNS to child DC
  ansible.windows.win_dns_client:
    adapter_names: "*"
    dns_servers:
      - "{{ child_dc_ip }}"

- name: Wait for child domain to be reachable
  ansible.windows.win_shell: |
    $timeout = 600; $start = Get-Date
    while ((Get-Date) - $start -lt [TimeSpan]::FromSeconds($timeout)) {
      try {
        $result = Resolve-DnsName "{{ child_fqdn }}" -Server "{{ child_dc_ip }}" -ErrorAction Stop
        if ($result) { Write-Output "CHILD_READY"; exit 0 }
      } catch { Start-Sleep -Seconds 15 }
    }
    Write-Error "Child DC not reachable after $timeout seconds"
    exit 1
  register: child_ready
  changed_when: false
  retries: 3
  delay: 60
  until: child_ready.stdout is search("CHILD_READY")

- name: Join scranton.dundermifflin.local domain
  microsoft.ad.membership:
    dns_domain_name: "{{ child_fqdn }}"
    domain_admin_user: "{{ parent_domain }}\\{{ domain_admin_user }}"
    domain_admin_password: "{{ domain_admin_password }}"
    domain_ou_path: "OU=Workstations,OU=Scranton,{{ child_domain_dn }}"
    state: domain
    reboot: true
  register: domain_join

- name: Wait for reboot after domain join
  ansible.builtin.wait_for_connection:
    timeout: 300
    delay: 30
  when: domain_join is changed

- name: Add mscott to local Administrators
  ansible.windows.win_group_membership:
    name: Administrators
    members:
      - "{{ child_fqdn }}\\{{ local_admin_user }}"
    state: present

- name: Configure RBCD path (pbeesly GenericWrite on this workstation)
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $pbeesly = Get-ADUser "pbeesly" -Server "{{ child_dc_ip }}"
    $computer = Get-ADComputer "{{ ansible_hostname }}" -Server "{{ child_dc_ip }}"
    $acl = Get-Acl ("AD:" + $computer.DistinguishedName)
    $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($pbeesly.SID, "GenericWrite", "Allow")
    $acl.AddAccessRule($ace)
    Set-Acl ("AD:" + $computer.DistinguishedName) $acl
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: "{{ parent_domain }}\\{{ domain_admin_user }}"
    ansible_become_password: "{{ domain_admin_password }}"

  failed_when: false
